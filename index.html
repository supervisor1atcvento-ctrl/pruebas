<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Moto</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #f4f4f9;
        margin-top: 50px;
    }

    /* CONTENEDOR PRINCIPAL */
    #game-container {
        position: relative;
        width: 600px; /* Ancho del área */
        height: 150px;
        background-color: #e0e0e0;
        border: 3px solid #333;
        border-radius: 8px;
        /* Esta propiedad es la magia que evita que los elementos se salgan visualmente */
        overflow: hidden; 
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    /* PUNTAJE (Fijo a la izquierda) */
    #score-board {
        position: absolute;
        left: 15px; /* Lo ancla al lado izquierdo */
        top: 15px;  /* Lo separa un poco del techo */
        font-size: 18px;
        font-weight: bold;
        color: #333;
        background: rgba(255, 255, 255, 0.8); /* Fondo con un poco de transparencia */
        padding: 5px 10px;
        border-radius: 5px;
        z-index: 100; /* Asegura que siempre esté por encima de la moto */
    }

    /* LA MOTO */
    #moto {
        position: absolute;
        left: 0px;
        bottom: 20px;
        font-size: 40px; /* Usamos un emoji para que funcione sin cargar imágenes externas */
        transition: left 0.1s ease-out; /* Movimiento fluido */
        z-index: 50;
    }

    /* LA META */
    #meta {
        position: absolute;
        right: 10px;
        bottom: 20px;
        font-size: 40px;
        z-index: 40;
    }

    /* BOTÓN */
    button {
        margin-top: 30px;
        padding: 12px 24px;
        font-size: 16px;
        cursor: pointer;
        background-color: #d32f2f;
        color: white;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        transition: background-color 0.2s;
    }

    button:hover {
        background-color: #b71c1c;
    }
</style>
</head>
<body>

<div id="game-container">
    <!-- El puntaje ahora está seguro del lado izquierdo -->
    <div id="score-board">Puntaje: <span id="score">0</span></div>
    
    <!-- Elementos del juego -->
    <div id="moto">🏍️</div>
    <div id="meta">🏁</div>
</div>

<button onclick="avanzarMoto()">¡Acelerar!</button>

<script>
    // Variables iniciales
    let posicionMoto = 0;
    let puntaje = 0;
    
    // Capturamos los elementos del HTML
    const motoElement = document.getElementById('moto');
    const scoreElement = document.getElementById('score');
    const contenedor = document.getElementById('game-container');
    
    // Calculamos el límite estricto para que la moto no se salga de la pantalla.
    // Tomamos el ancho del contenedor y le restamos 45px (el ancho aproximado del emoji de la moto)
    const limiteMaximo = contenedor.clientWidth - 45; 

    function avanzarMoto() {
        // Aumentamos la posición y los puntos cada vez que se hace clic
        posicionMoto += 35; 
        puntaje += 15;

        // RESTRICCIÓN DE LÍMITE: Si la moto intenta pasar el máximo, la obligamos a quedarse en el tope
        if (posicionMoto >= limiteMaximo) {
            posicionMoto = limiteMaximo; 
        }

        // Aplicamos los cambios visuales
        motoElement.style.left = posicionMoto + 'px';
        scoreElement.innerText = puntaje;

        // Verificamos si la moto ya tocó la meta
        if (posicionMoto === limiteMaximo) {
            // Damos un pequeño retraso (100ms) para que se alcance a ver la moto cruzando la meta antes del aviso
            setTimeout(() => {
                alert("¡Llegaste a la meta! Puntaje final: " + puntaje);
                reiniciar(); // Volvemos todo a cero
            }, 100);
        }
    }

    function reiniciar() {
        posicionMoto = 0;
        puntaje = 0;
        motoElement.style.left = '0px';
        scoreElement.innerText = puntaje;
    }
</script>

</body>
</html>
