<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de VIN - Baterías</title>
  <style>
    /* Los colores de la marca se mantienen: Negro, Blanco y Naranja */
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-orange: #ff6600;
      --accent-orange-hover: #e05500;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #333333;
      --status-success: #2e7d32;
      --status-danger: #c62828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #2a2a2a;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent-orange);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-orange);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: var(--accent-orange-hover);
    }

    button:active {
      transform: scale(0.99);
    }

    button:disabled {
      background-color: #444444;
      cursor: not-allowed;
    }

    .result-card {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      display: none;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .result-card.success {
      background-color: rgba(46, 125, 50, 0.2);
      border: 1px solid var(--status-success);
      color: #81c784;
    }

    .result-card.danger {
      background-color: rgba(198, 40, 40, 0.2);
      border: 1px solid var(--status-danger);
      color: #e57373;
    }

    .result-card.error {
      background-color: rgba(255, 152, 0, 0.2);
      border: 1px solid #ffb74d;
      color: #ffb74d;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Consulta de VIN</h1>
      <p>Base de datos pública de Baterías</p>
    </div>

    <form id="vinForm" onsubmit="buscarVIN(event)">
      <div class="form-group">
        <label for="vinInput">Número de VIN</label>
        <input 
          type="text" 
          id="vinInput" 
          placeholder="Ingrese VIN..." 
          autocomplete="off" 
          required
        >
      </div>
      <button type="submit" id="btnSubmit">Validar en Base</button>
    </form>

    <div id="resultCard" class="result-card"></div>
  </div>

  <script>
    const SPREADSHEET_ID = '1qxnp3r976gbgxO_ws0XymcMkH0XRklldWp5HEf-gaU4';
    const GID = '1280448484';

    async function buscarVIN(e) {
      e.preventDefault();
      
      const vinInput = document.getElementById('vinInput');
      const btnSubmit = document.getElementById('btnSubmit');
      const resultCard = document.getElementById('resultCard');
      const vinBuscado = vinInput.value.trim().toUpperCase();

      if (!vinBuscado) return;

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span class="spinner"></span>Consultando...';
      resultCard.style.display = 'none';

      try {
        // Usamos la API de visualización de Google para hacer un query directo al servidor
        // Esto descarga solo unos cuantos bytes de respuesta en lugar de todo el documento.
        const querySQL = encodeURIComponent(`select C where upper(C) = '${vinBuscado}' limit 1`);
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tq=${querySQL}&gid=${GID}`;

        const response = await fetch(url);
        if (!response.ok) throw new Error('Error al conectar con la base de datos.');

        const text = await response.text();
        
        // Google devuelve la respuesta envuelta en una función, extraemos el JSON puro
        const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const data = JSON.parse(jsonString);

        btnSubmit.disabled = false;
        btnSubmit.innerText = 'Validar en Base';

        // Si la tabla contiene filas, significa que el VIN fue encontrado
        if (data.table && data.table.rows && data.table.rows.length > 0) {
          mostrarResultado('success', 'ENCONTRADO EN LA BASE DE DATOS');
        } else {
          mostrarResultado('danger', 'NO SE ENCUENTRA EN LA BASE DE DATOS');
        }

      } catch (err) {
        btnSubmit.disabled = false;
        btnSubmit.innerText = 'Validar en Base';
        mostrarResultado('error', '⚠️ Error al consultar: ' + err.message);
      }
    }

    function mostrarResultado(tipo, texto) {
      const resultCard = document.getElementById('resultCard');
      resultCard.className = 'result-card ' + tipo;
      resultCard.innerText = texto;
      resultCard.style.display = 'block';
    }
  </script>
</body>
</html>
