<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Segmentador de Agencias — Vento ATC</title>
<!-- Tipografía e Iconos Institucionales -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --vento-white: #FFFFFF;
  --vento-bg: #F4F5F7;
  --vento-black: #1A1A1A;
  --vento-gray-dark: #4B5563;
  --vento-gray-light: #E5E7EB;
  --vento-orange: #F28F17;
  --vento-orange-hover: #D97D11;
  --radius: 12px;
  --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background-color: var(--vento-bg);
  font-family: 'Inter', system-ui, sans-serif;
  color: var(--vento-black);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
}

.card-container {
  background: var(--vento-white);
  border: 2px solid var(--vento-black);
  border-radius: 16px;
  width: 100%;
  max-width: 580px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.header {
  background: var(--vento-black);
  color: var(--vento-white);
  padding: 20px 24px;
  border-bottom: 4px solid var(--vento-orange);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.header i { color: var(--vento-orange); }

.content { padding: 24px; }

.search-box {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

.input-field {
  flex: 1;
  padding: 12px 16px;
  border-radius: 8px;
  border: 2px solid var(--vento-black);
  font-size: 15px;
  font-weight: 700;
  outline: none;
  font-family: inherit;
  text-transform: uppercase;
}

.input-field:focus {
  border-color: var(--vento-orange);
  box-shadow: 0 0 0 3px rgba(242, 143, 23, 0.15);
}

.btn-main {
  padding: 12px 20px;
  background: var(--vento-black);
  color: var(--vento-white);
  border: 2px solid var(--vento-black);
  border-radius: 8px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-transform: uppercase;
  font-size: 13px;
}

.btn-main:hover {
  background: var(--vento-orange);
  border-color: var(--vento-orange);
}

.db-results {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}

.db-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border-radius: 8px;
  border: 2px solid var(--vento-gray-light);
  background: var(--vento-bg);
  cursor: pointer;
  transition: all 0.2s;
}

.db-item:hover {
  border-color: var(--vento-orange);
  background: var(--vento-white);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
}

.badge-orange { background: var(--vento-orange); color: var(--vento-white); }
.badge-black { background: var(--vento-black); color: var(--vento-white); }

/* ÁREA DE DECISIÓN / WIZARD */
.decision-panel {
  display: none;
  border-top: 2px dashed var(--vento-gray-light);
  padding-top: 20px;
  margin-top: 20px;
}

.agency-header-info {
  margin-bottom: 16px;
  padding: 12px 16px;
  background: var(--vento-bg);
  border-left: 4px solid var(--vento-orange);
  border-radius: 4px;
}

.agency-header-info h3 { margin: 0 0 6px 0; font-size: 15px; font-weight: 800; }

.question-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.wizard-btn {
  width: 100%;
  background-color: var(--vento-white);
  color: var(--vento-black);
  border: 2px solid var(--vento-gray-light);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 14px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  transition: all 0.2s;
  font-family: inherit;
}

.wizard-btn:hover {
  border-color: var(--vento-orange);
  box-shadow: 0 4px 12px rgba(242, 143, 23, 0.12);
  transform: translateY(-1px);
}

.btn-back {
  background: transparent;
  border: none;
  color: var(--vento-gray-dark);
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  margin-top: 12px;
  padding: 0;
}

/* DICTAMEN FINAL */
.dictamen-box {
  display: none;
  margin-top: 16px;
  padding: 18px;
  border-radius: 8px;
}

.dictamen-garantia {
  border: 2px solid #10B981;
  border-left: 8px solid #10B981;
  background: #ECFDF5;
  color: #065F46;
}

.dictamen-cotizacion {
  border: 2px solid var(--vento-black);
  border-left: 8px solid var(--vento-orange);
  background: var(--vento-black);
  color: var(--vento-white);
}

.dictamen-cierre {
  border: 2px solid #EF4444;
  border-left: 8px solid #EF4444;
  background: #FEF2F2;
  color: #991B1B;
}

.dictamen-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 800;
  margin-bottom: 6px;
  opacity: 0.9;
}

.dictamen-value {
  font-size: 18px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 10px;
}
</style>
</head>
<body>

<div class="card-container">
  <div class="header">
    <h1><i class="fa-solid fa-store"></i> Segmentador de Agencias</h1>
    <span style="font-size: 11px; font-weight: 800; opacity: 0.7;">VENTO ATC</span>
  </div>

  <div class="content">
    <p style="margin: 0 0 14px 0; font-size: 13px; color: var(--vento-gray-dark); font-weight: 500;">
      Busca una agencia para verificar su kit de herramientas y determinar la resolución oficial del ticket.
    </p>

    <!-- Buscador -->
    <div class="search-box">
      <input type="text" id="inputAgencia" class="input-field" placeholder="Nombre o número de agencia..." autocomplete="off" onkeyup="if(event.key === 'Enter') buscarAgencia()">
      <button onclick="buscarAgencia()" class="btn-main">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>

    <!-- Resultados Búsqueda -->
    <div id="resultadosAgencia" class="db-results"></div>

    <!-- Panel Interactivo de Dictamen -->
    <div id="panelDictamen" class="decision-panel">
      <div class="agency-header-info">
        <h3 id="nombreAgenciaSeleccionada"></h3>
        <div id="badgeAgenciaSeleccionada"></div>
      </div>

      <!-- Contenedor del Wizard -->
      <div id="wizardContainer"></div>

      <!-- Caja de Dictamen Final -->
      <div id="boxDictamenFinal" class="dictamen-box"></div>
    </div>
  </div>
</div>

<script>
// =========================================
// CÁRGA DE BASE DE DATOS DE AGENCIAS
// =========================================
let bbddAgencias = [];
let cargandoAgencias = false;

async function inicializarBaseAgencias() {
  if (bbddAgencias.length > 0 || cargandoAgencias) return;
  cargandoAgencias = true;
  const urlCSV = `https://docs.google.com/spreadsheets/d/1ZV84x-E4d_iJz7An7aKQ5qjyK6p0vil81GGqrJbmLJY/gviz/tq?tqx=out:csv&sheet=Agencias`;
  try {
    const res = await fetch(urlCSV);
    const texto = await res.text();
    const lineas = texto.split(/\r?\n/);
    for(let i = 1; i < lineas.length; i++) {
      if(!lineas[i]) continue;
      let col = []; let celda = ''; let comillas = false;
      for(let char of lineas[i]) {
        if(char === '"') { comillas = !comillas; }
        else if(char === ',' && !comillas) { col.push(celda.trim()); celda = ''; }
        else { celda += char; }
      }
      col.push(celda.trim());
      if(col.length > 1 && col[1]) {
        bbddAgencias.push({
          nombre: col[1].replace(/"/g, '').trim(),
          puede: (col[14] || '').replace(/"/g, '').trim().toUpperCase()
        });
      }
    }
  } catch (error) {
    console.error("Error al cargar agencias:", error);
  } finally {
    cargandoAgencias = false;
  }
}

function buscarAgencia() {
  const input = document.getElementById('inputAgencia').value.trim().toLowerCase();
  const contenedorResultados = document.getElementById('resultadosAgencia');
  document.getElementById('panelDictamen').style.display = 'none';

  if (!input) return;
  if (bbddAgencias.length === 0) {
    contenedorResultados.innerHTML = `<div style="font-size:13px; color:var(--vento-gray-dark); text-align:center;"><i class="fa-solid fa-spinner fa-spin"></i> Cargando directorio...</div>`;
    return;
  }

  const coincidencias = bbddAgencias.filter(a => a.nombre.toLowerCase().includes(input)).slice(0, 4);
  contenedorResultados.innerHTML = '';

  if (coincidencias.length === 0) {
    contenedorResultados.innerHTML = `
      <div class="db-item" style="border-color: #EF4444; flex-direction: column; align-items: flex-start; gap: 8px;">
        <div style="color: #EF4444; font-weight: 800; font-size: 13px;"><i class="fa-solid fa-store-slash"></i> AGENCIA NO LOCALIZADA</div>
        <div style="font-size: 12px; color: var(--vento-gray-dark);">Si no está registrada, evalúala asumiendo que <strong>NO</strong> tiene herramientas.</div>
        <button onclick="seleccionarAgencia('AGENCIA NO REGISTRADA', 'SI')" class="btn-main" style="padding: 8px 12px; font-size: 12px;">
          <i class="fa-solid fa-clipboard-list"></i> Evaluar Manualmente
        </button>
      </div>
    `;
  } else {
    coincidencias.forEach(agencia => {
      const claseBadge = (agencia.puede === 'SI') ? 'badge-orange' : 'badge-black';
      const textoBadge = (agencia.puede === 'SI') ? '<i class="fa-solid fa-ban"></i> SIN HERRAMIENTAS' : '<i class="fa-solid fa-check"></i> CON HERRAMIENTAS';
      const nombreEscapado = agencia.nombre.replace(/'/g, "\\'");

      contenedorResultados.innerHTML += `
        <div class="db-item" onclick="seleccionarAgencia('${nombreEscapado}', '${agencia.puede}')">
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <span style="font-weight: 800; font-size: 14px;">${agencia.nombre}</span>
            <div><span class="badge ${claseBadge}">${textoBadge}</span></div>
          </div>
          <i class="fa-solid fa-chevron-right" style="color: var(--vento-gray-dark);"></i>
        </div>
      `;
    });
  }
}

function seleccionarAgencia(nombre, puede) {
  document.getElementById('resultadosAgencia').innerHTML = '';
  const sinHerramientas = (puede === 'SI');
  
  const claseBadge = sinHerramientas ? 'badge-orange' : 'badge-black';
  const textoBadge = sinHerramientas ? '<i class="fa-solid fa-ban"></i> NO CUENTA CON KIT DE HERRAMIENTAS' : '<i class="fa-solid fa-check"></i> SÍ CUENTA CON KIT DE HERRAMIENTAS';

  document.getElementById('nombreAgenciaSeleccionada').innerText = nombre;
  document.getElementById('badgeAgenciaSeleccionada').innerHTML = `<span class="badge ${claseBadge}">${textoBadge}</span>`;

  // === AQUÍ SE APLICA LA REGLA DINÁMICA ===
  wizardTree.falla.opciones = [
    { texto: "Fallas mecánicas", resolucion: "PASA POR GARANTÍA", tipo: "garantia" },
    { texto: "Fugas de gasolina", resolucion: "PASA POR GARANTÍA", tipo: "garantia" },
    { texto: "Fallas eléctricas", resolucion: "PASA POR GARANTÍA", tipo: "garantia" },
    { texto: "Ajustes o colocación de accesorios", resolucion: "PASA POR GARANTÍA", tipo: "garantia" },
    { texto: "Faltantes", resolucion: "PASA POR COTIZACIÓN", tipo: "cotizacion" },
    { texto: "Daños estéticos", resolucion: "PASA POR COTIZACIÓN", tipo: "cotizacion" },
    { 
      texto: "Revisión general / Terminado de activar / Sin gasolina", 
      resolucion: sinHerramientas ? "PASA POR GARANTÍA" : "CERRAR TICKET", 
      tipo: sinHerramientas ? "garantia" : "cierre" 
    }
  ];

  document.getElementById('panelDictamen').style.display = 'block';
  iniciarWizard();
}

// =========================================
// ÁRBOL DE DECISIONES DE RESOLUCIÓN (WIZARD)
// =========================================
const wizardTree = {
  inicio: {
    pregunta: "¿Quién registró el Armado y Activado (AYA) en VENTONET?",
    opciones: [
      { texto: "CEDIS", next: "checklist" },
      { texto: "CESVE", next: "tiempo_armado" },
      { texto: "No se sabe quién hizo el AYA", next: "comparte_cl" }
    ]
  },
  checklist: {
    pregunta: "¿La unidad cuenta con Check List?",
    opciones: [
      { texto: "Sí cuenta con Check List", next: "falla" },
      { texto: "No cuenta con Check List", next: "tiene_to" }
    ]
  },
  tiene_to: {
    pregunta: "¿La unidad cuenta con TO (Orden de Transferencia)?",
    opciones: [
      { texto: "Sí", next: "reporto_sin_cl" },
      { texto: "No", resolucion: "PASA POR COTIZACIÓN", tipo: "cotizacion" }
    ]
  },
  reporto_sin_cl: {
    pregunta: "¿Se reportó oportunamente que la unidad llegó sin Check List?",
    opciones: [
      { texto: "Sí se reportó", next: "falla" },
      { texto: "No se reportó", resolucion: "PASA POR COTIZACIÓN", tipo: "cotizacion" }
    ]
  },
  tiempo_armado: {
    pregunta: "¿Cuándo se terminó el armado y activado de la unidad?",
    opciones: [
      { texto: "2 días o menos", resolucion: "PASA POR GARANTÍA", tipo: "garantia" },
      { texto: "Más de 2 días", resolucion: "PASA POR COTIZACIÓN", tipo: "cotizacion" }
    ]
  },
  comparte_cl: {
    pregunta: "Se solicitó el Check List a la agencia. ¿Lo compartió?",
    opciones: [
      { texto: "Sí lo compartió (Procesar como CEDIS)", next: "checklist" },
      { texto: "No lo compartió", next: "llego_huacal" }
    ]
  },
  llego_huacal: {
    pregunta: "¿La agencia comenta que la unidad llegó en huacal?",
    opciones: [
      { texto: "Sí tiene evidencias (Procesar como CESVE)", next: "tiempo_armado" },
      { texto: "No tiene evidencias / Dar seguimiento de 1 día", next: "seguimiento_1dia" }
    ]
  },
  seguimiento_1dia: {
    pregunta: "Tras otorgar el plazo de seguimiento de 1 día...",
    opciones: [
      { texto: "Ya compartió las evidencias necesarias", next: "tiempo_armado" },
      { texto: "Ya pasó 1 día y NO compartió nada", resolucion: "CERRAR EL TICKET", tipo: "cierre" }
    ]
  },
  falla: {
    pregunta: "¿Qué tipo de falla o daño reporta el cliente?",
    opciones: [] // Se inyecta dinámicamente en la función seleccionarAgencia()
  }
};

let historialWizard = [];

function iniciarWizard() {
  historialWizard = [];
  document.getElementById('boxDictamenFinal').style.display = 'none';
  renderStep('inicio');
}

function renderStep(stepId) {
  const container = document.getElementById('wizardContainer');
  const step = wizardTree[stepId];

  let html = `
    <div class="question-title">
      <i class="fa-solid fa-circle-question" style="color: var(--vento-orange);"></i>
      ${step.pregunta}
    </div>
  `;

  step.opciones.forEach(opt => {
    const action = opt.next ? `avanzar('${stepId}', '${opt.next}')` : `finalizar('${opt.resolucion}', '${opt.tipo}')`;
    html += `
      <button onclick="${action}" class="wizard-btn">
        <span>${opt.texto}</span>
        <i class="fa-solid fa-chevron-right" style="color: var(--vento-gray-dark); font-size: 12px;"></i>
      </button>
    `;
  });

  if (historialWizard.length > 0) {
    html += `
      <button onclick="retroceder()" class="btn-back">
        <i class="fa-solid fa-arrow-left"></i> Volver a la pregunta anterior
      </button>
    `;
  }

  container.innerHTML = html;
}

function avanzar(current, next) {
  historialWizard.push(current);
  renderStep(next);
}

function retroceder() {
  if (historialWizard.length > 0) {
    const prev = historialWizard.pop();
    document.getElementById('boxDictamenFinal').style.display = 'none';
    renderStep(prev);
  }
}

function finalizar(resolucion, tipo) {
  document.getElementById('wizardContainer').innerHTML = '';
  const caja = document.getElementById('boxDictamenFinal');

  let claseTipo = '';
  let icono = '';

  if (tipo === 'garantia') {
    claseTipo = 'dictamen-garantia';
    icono = '<i class="fa-solid fa-circle-check"></i>';
  } else if (tipo === 'cotizacion') {
    claseTipo = 'dictamen-cotizacion';
    icono = '<i class="fa-solid fa-file-invoice-dollar" style="color: var(--vento-orange);"></i>';
  } else {
    claseTipo = 'dictamen-cierre';
    icono = '<i class="fa-solid fa-circle-xmark"></i>';
  }

  caja.className = `dictamen-box ${claseTipo}`;
  caja.style.display = 'block';
  caja.innerHTML = `
    <div class="dictamen-title">Resolución Oficial del Ticket</div>
    <div class="dictamen-value">${icono} ${resolucion}</div>
    <button onclick="iniciarWizard()" class="btn-back" style="margin-top: 14px;">
      <i class="fa-solid fa-rotate-right"></i> Evaluar de nuevo
    </button>
  `;
}

// Inicializar base de datos al cargar
window.addEventListener('DOMContentLoaded', inicializarBaseAgencias);
</script>

</body>
</html>
